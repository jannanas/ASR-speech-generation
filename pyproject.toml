[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ASR-speech-generation"
version = "0.1.0"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "lib*", "vendor*"]