#         !ref <drop_chunk>]

############################## Models ##########################################

whisper_pretrained: &id001 !new:speechbrain.integrations.huggingface.whisper.Whisper
  source: 
    /home/nfs/yzhang96/.cache/huggingface/hub/models--openai--whisper-large-v3/snapshots/06f233fe06e710322aca913c1bc4249a0d71fce1
  freeze_encoder: true
  save_path: 
    results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986/save/whisper_checkpoint
  language: nl
  task: transcribe
  sampling_rate: 16_000

whisper: &id002 !new:speechbrain.nnet.adapters.AdaptedModel

############################## Decoding & optimiser ############################

  model_to_adapt: *id001
  adapter_class: !name:speechbrain.nnet.adapters.LoRA
  all_linear: true
  adapter_kwargs:
    rank: 16

log_softmax: !new:speechbrain.nnet.activations.Softmax
  apply_log: true

nll_loss: !name:speechbrain.nnet.losses.nll_loss

modules:
  whisper: *id002
whisper_opt_class: !name:torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.01

valid_search: !new:speechbrain.decoders.seq2seq.S2SWhisperGreedySearcher
  model: *id002
  min_decode_ratio: 0.0
  max_decode_ratio: 1.0

test_search: !new:speechbrain.decoders.seq2seq.S2SWhisperBeamSearcher
  module: [*id002]
  min_decode_ratio: 0.0
  max_decode_ratio: 1.0
  beam_size: 10

lr_annealing_whisper: &id003 !new:speechbrain.nnet.schedulers.NoamScheduler
  lr_initial: 1e-5
  n_warmup_steps: 500

############################## Logging and Pretrainer ##########################

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986/save
  recoverables:
    whisper: *id002
    scheduler_whisper: *id003
    counter: *id004
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986/train_log.txt

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

cer_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats
  split_tokens: true
