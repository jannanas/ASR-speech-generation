# yamllint disable
# ################################
# Model: Whisper (Encoder-Decoder) + NLL + LoRA
# Augmentation: TimeDomainSpecAugment
# Authors: Peter Plantinga 2024, Adel Moumen 2022 & 2024, Titouan Parcollet 2022
# ################################

# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 1986
__set_seed: !apply:speechbrain.utils.seed_everything [1986]
output_folder: results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986
output_wer_folder: results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986/
save_folder: results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986/save
train_log: results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986/train_log.txt

# URL for the whisper model
#whisper_hub: openai/whisper-small.en
whisper_folder: 
  results/whisper-V3-L_FT_Zwiterlood_JannetBot2/1986/save/whisper_checkpoint

# Normalize the english inputs with
# the same normalization done in the paper
normalized_transcripts: false

# Data files
data_folder: 
  /tudelft.net/staff-bulk/ewi/insy/SpeechLab/yuanyuanzhang/speechbrain/recipes/BscChildDLD/ASR/transformer/data/COPAS_missing_transcript            # e,g./path/to/LibriSpeech
train_splits: [train-clean-100]   #, "train-clean-360", "train-other-500"]
dev_splits: [dev-clean]
test_splits: [dev-clean, test-clean, test-other]
skip_prep: true
train_csv: 
  /tudelft.net/staff-bulk/ewi/insy/SpeechLab/yuanyuanzhang/speechbrain/recipes/BscChildDLD/ASR/transformer/csvs/Zwitserlood_train_Jannet_bot2.csv
valid_csv: 
  /tudelft.net/staff-bulk/ewi/insy/SpeechLab/yuanyuanzhang/speechbrain/recipes/BscChildDLD/ASR/transformer/csvs/Zwitserlood_val.csv
test_csv:
- /tudelft.net/staff-bulk/ewi/insy/SpeechLab/yuanyuanzhang/speechbrain/recipes/BscChildDLD/ASR/transformer/csvs/Zwitserlood_test.csv
#    - !ref <output_folder>/dev-clean.csv
#    - !ref <output_folder>/test-clean.csv
#    - !ref <output_folder>/test-other.csv

ckpt_interval_minutes: 1 # save checkpoint every N min

############################## Training Parameters #############################
freeze_encoder: true
number_of_epochs: 50
weight_decay: 0.01
lr_whisper: 1e-5
warmup_steps: 500
max_grad_norm: 2.0
sorting: ascending
precision: fp16 # bf16, fp16 or fp32
eval_precision: fp16
sampling_rate: 16_000

# With data_parallel batch_size is split into N jobs
# With DDP batch_size is multiplied by N jobs
# This setup works well with 1x 32GB GPU
batch_size: 2
test_batch_size: 1
grad_accumulation_factor: 8

# Decoding parameters
min_decode_ratio: 0.0
max_decode_ratio: 1.0
test_beam_size: 10

# Lora configuration
lora_rank: 16

####################### Model Parameters #######################################

train_loader_kwargs:
  batch_size: 2

valid_loader_kwargs:
  batch_size: 1

test_loader_kwargs:
  batch_size: 1


epoch_counter: &id004 !new:speechbrain.utils.epoch_loop.EpochCounter

  limit: 50

############################## Augmentations ###################################

